name: Bug report
description: Something does not work as expected.
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include real photos, names, emails, or addresses** anywhere
        in this issue, including screenshots and logs. Use the sample data from `npm run dev`.

        A way to see a photo, a member's details, or to get around two-guardian approval is a
        security issue: follow SECURITY.md and report it privately instead.
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Signing in, invites, or account recovery
        - Photos, sharing, or downloads
        - Admin, governance, or audit trail
        - Deployment (Caddy, systemd, database, bucket)
        - Backups or restore
        - Running from source (developer)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 0.1.0 or a commit hash
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as parent@example.com (npm run dev)
        2. Open a photo and ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include any error message word for word, with personal details removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Node 24 on Ubuntu 24.04, Safari on iPhone
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no real photos or personal details.
          required: true
