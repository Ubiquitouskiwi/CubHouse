# systemd drop-in for running the backup and alert units on a StarlingTek host,
# where the app runs in a container and `stk env` owns its configuration.
#
# Install for BOTH units (see docs/DEPLOY-STARLINGTEK.md, "Backups and alerts"):
#   sudo install -D -m 0644 deploy/starlingtek/env.conf \
#     /etc/systemd/system/family-photos-backup.service.d/starlingtek.conf
#   sudo install -D -m 0644 deploy/starlingtek/env.conf \
#     /etc/systemd/system/family-photos-alert@.service.d/starlingtek.conf
#   sudo systemctl daemon-reload
#
# The empty line clears the plain-server path (/etc/family-photos/app.env).
# 1. The app's own env, exactly as StarlingTek injects it into the container,
#    so the backup can never run against a different database or bucket.
#    systemd reads this file as root before dropping to the unit's user, so
#    the file stays root-only (0600). Change "family-photos" if your
#    StarlingTek project has another name.
# 2. Host-only keys the app never reads (backup bucket, age recipients, s3cmd
#    configs, ALERT_EMAIL, and the host path of the database CA certificate).
#    Later files win, so PGSSLROOTCERT here overrides the container path.

[Service]
EnvironmentFile=
EnvironmentFile=/srv/starlingtek/projects/family-photos/env
EnvironmentFile=/etc/family-photos/host.env
